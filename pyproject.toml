[project]
name = "e-commerce-chatbot"
version = "0.1.0"
description = "A multi-turn e-commerce support agent that improves itself with Braintrust and Loop"
requires-python = ">=3.12"
dependencies = [
    "anthropic[mcp]>=1.0",
    "braintrust>=0.48.1",
    "mcp>=2.0",
    "python-dotenv>=1.0",
    "supabase>=2.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
